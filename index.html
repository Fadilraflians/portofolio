    <!-- Preloader styles: inline and first, so the loading screen paints before anything else -->
    <style>
      html.is-loading, html.is-loading body { overflow: hidden; }
      #preloader {
        --pl-cyan: #22d3ee;
        --pl-blue: #3b82f6;
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        color: #e2e8f0;
        /* failsafe: never block the site if the script below fails */
        animation: plFailsafe 0s 12s forwards;
      }
      .pl-door {
        position: absolute; left: 0; right: 0; height: 50.5%;
        background:
          radial-gradient(ellipse 60% 70% at 50% 100%, rgba(34, 211, 238, 0.10), transparent 70%),
          linear-gradient(rgba(148, 163, 184, 0.045) 1px, transparent 1px) 0 0 / 44px 44px,
          linear-gradient(90deg, rgba(148, 163, 184, 0.045) 1px, transparent 1px) 0 0 / 44px 44px,
          #07090e;
        transition: transform 0.9s cubic-bezier(0.76, 0, 0.24, 1);
      }
      .pl-door-top { top: 0; }
      .pl-door-bottom { bottom: 0; background:
          radial-gradient(ellipse 60% 70% at 50% 0%, rgba(34, 211, 238, 0.10), transparent 70%),
          linear-gradient(rgba(148, 163, 184, 0.045) 1px, transparent 1px) 0 0 / 44px 44px,
          linear-gradient(90deg, rgba(148, 163, 184, 0.045) 1px, transparent 1px) 0 0 / 44px 44px,
          #07090e; }
      .pl-seam {
        position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px;
        background: linear-gradient(90deg, transparent, var(--pl-cyan) 30%, #fff 50%, var(--pl-cyan) 70%, transparent);
        box-shadow: 0 0 18px var(--pl-cyan), 0 0 42px rgba(34, 211, 238, 0.6);
        transform: scaleX(0); opacity: 0;
        transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.45s ease;
      }
      .pl-content {
        position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px;
        padding: 0 16px; text-align: center;
        transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
      }
      .pl-reactor { position: relative; width: clamp(150px, 38vw, 190px); aspect-ratio: 1; }
      .pl-reactor svg { width: 100%; height: 100%; overflow: visible; }
      .pl-reactor circle { fill: none; }
      .pl-track { stroke: rgba(148, 163, 184, 0.12); stroke-width: 3; }
      .pl-progress {
        stroke: url(#plGrad); stroke-width: 3.5; stroke-linecap: round;
        stroke-dasharray: 552.92; stroke-dashoffset: 552.92;
        transform: rotate(-90deg); transform-origin: 100px 100px;
        filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.8));
      }
      .pl-ring-a { stroke: rgba(34, 211, 238, 0.55); stroke-width: 6; stroke-dasharray: 14 9; }
      .pl-ring-b { stroke: rgba(129, 140, 248, 0.5); stroke-width: 2; stroke-dasharray: 2 7; }
      .pl-spin { transform-origin: 100px 100px; animation: plSpin 6s linear infinite; }
      .pl-spin-rev { transform-origin: 100px 100px; animation: plSpin 9s linear infinite reverse; }
      .pl-core {
        position: absolute; inset: 31%; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(165, 243, 252, 0.75) 22%, rgba(34, 211, 238, 0.28) 52%, transparent 72%);
        animation: plPulse 1.8s ease-in-out infinite;
      }
      .pl-percent {
        position: absolute; inset: 0; display: grid; place-items: center;
        font-family: 'Fira Code', ui-monospace, monospace; font-weight: 600;
        font-size: clamp(22px, 5.5vw, 28px); color: #04121a; letter-spacing: -0.02em;
      }
      .pl-percent small { font-size: 0.55em; margin-left: 1px; opacity: 0.8; }
      .pl-name { font-weight: 800; font-size: clamp(18px, 4.6vw, 24px); letter-spacing: 0.32em; padding-left: 0.32em; color: #fff; }
      .pl-name span {
        background: linear-gradient(135deg, #ffffff 0%, #38bdf8 50%, #06b6d4 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      }
      .pl-status {
        min-height: 1.4em; font-family: 'Fira Code', ui-monospace, monospace; font-size: 12px;
        letter-spacing: 0.18em; text-transform: uppercase; color: rgba(148, 163, 184, 0.85);
      }
      .pl-status::before { content: '> '; color: var(--pl-cyan); }
      .pl-bar { width: min(260px, 70vw); height: 2px; border-radius: 2px; background: rgba(148, 163, 184, 0.14); overflow: hidden; }
      .pl-bar i {
        display: block; height: 100%; width: 100%; transform: scaleX(0); transform-origin: left;
        background: linear-gradient(90deg, var(--pl-blue), var(--pl-cyan));
        box-shadow: 0 0 10px var(--pl-cyan);
      }

      /* exit: content dims, the seam lights up, then the doors part */
      #preloader.pl-exit .pl-content { opacity: 0; transform: scale(0.92); }
      #preloader.pl-exit .pl-seam { opacity: 1; transform: scaleX(1); }
      #preloader.pl-open .pl-seam { opacity: 0; transition-duration: 0.3s; }
      #preloader.pl-open .pl-door-top { transform: translateY(-101%); }
      #preloader.pl-open .pl-door-bottom { transform: translateY(101%); }

      @keyframes plSpin { to { transform: rotate(360deg); } }
      @keyframes plPulse { 0%, 100% { opacity: 0.85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes plFailsafe { to { visibility: hidden; opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .pl-spin, .pl-spin-rev, .pl-core { animation: none; }
        .pl-door, .pl-content, .pl-seam { transition-duration: 0.01s; }
      }
    </style>

    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #07090e;
        color: #e2e8f0;
        overflow-x: hidden;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #07090e;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #06b6d4;
      }

      /* Glowing borders & glassmorphism */
      .glass-card {
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      
      .glass-card-hover {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card-hover:hover {
        border-color: rgba(6, 182, 212, 0.4);
        box-shadow: 0 10px 30px -10px rgba(6, 182, 212, 0.25);
        transform: translateY(-4px);
      }

      .glow-border-cyan {
        position: relative;
      }
      .glow-border-cyan::before {
        content: '';
        position: absolute;
        inset: -2px;
        background: linear-gradient(135deg, #00f2fe, #4facfe, #00c6ff);
        border-radius: inherit;
        z-index: -1;
        opacity: 0.7;
        filter: blur(8px);
        transition: opacity 0.3s ease;
      }
      .glow-border-cyan:hover::before {
        opacity: 1;
        filter: blur(12px);
      }

      /* Animated gradients */
      .gradient-text-cyan {
        background: linear-gradient(135deg, #ffffff 0%, #38bdf8 50%, #06b6d4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .gradient-text-bold {
        background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }

      .animate-float-slow {
        animation: floatSlow 5s ease-in-out infinite;
      }

      .animate-pulse-glow {
        animation: pulseGlow 4s ease-in-out infinite;
      }

      /* set by EffectsLayer on sections outside the viewport */
      .fx-paused, .fx-paused *, .fx-paused *::before, .fx-paused *::after { animation-play-state: paused !important; }

      /* ===== 3D TILT CARD ===== */
      .tilt-card {
        perspective: 1100px;
        --rx: 0deg; --ry: 0deg; --gx: 50%; --gy: 50%;
      }
      .tilt-card-inner {
        transform: rotateX(var(--rx)) rotateY(var(--ry));
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease;
        will-change: transform;
      }
      .tilt-card[data-active="1"] .tilt-card-inner {
        transition: transform 0.12s ease-out, box-shadow 0.4s ease;
        box-shadow: 0 30px 60px -20px rgba(6, 182, 212, 0.35), 0 0 0 1px rgba(34, 211, 238, 0.15);
      }
      .tilt-glare {
        position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        background: radial-gradient(circle at var(--gx) var(--gy), rgba(255,255,255,0.16), rgba(34,211,238,0.06) 30%, transparent 60%);
        opacity: 0; transition: opacity 0.4s ease; mix-blend-mode: screen; z-index: 40;
      }
      .tilt-card[data-active="1"] .tilt-glare { opacity: 1; }

      /* ===== 3D SCROLL REVEAL ===== */
      .reveal-3d {
        opacity: 0;
        transform: perspective(1200px) translate3d(0, 36px, -40px) rotateX(10deg);
        transform-origin: 50% 100%;
        transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        transition-delay: var(--reveal-delay, 0ms);
      }
      .reveal-3d.is-revealed {
        opacity: 1;
        transform: perspective(1200px) translate3d(0, 0, 0) rotateX(0deg);
      }

      /* ===== EXTRUDED 3D TEXT ===== */
      .text-3d {
        color: #fff;
        text-shadow:
          0 1px 0 #cbd5e1, 0 2px 0 #94a3b8, 0 3px 0 #64748b, 0 4px 0 #475569,
          0 5px 0 #334155, 0 6px 1px rgba(0,0,0,.2), 0 0 8px rgba(34,211,238,.25),
          0 10px 20px rgba(0,0,0,.45), 0 20px 40px rgba(6,182,212,.18);
      }
      .text-3d-glow {
        filter: drop-shadow(0 6px 0 rgba(8, 145, 178, 0.55)) drop-shadow(0 12px 24px rgba(34, 211, 238, 0.35));
      }

      /* ===== ORBITS / SKILL SPHERE ===== */
      @keyframes orbitSpin { to { transform: rotate(360deg); } }
      .orbit-spin { animation: orbitSpin 40s linear infinite; }
      .orbit-spin-reverse { animation: orbitSpin 60s linear infinite reverse; }
      .skill-orb-item > div { transition: border-color .3s, box-shadow .3s, background-color .3s; }
      .skill-orb-item[data-front="1"] > div {
        border-color: rgba(34, 211, 238, 0.7);
        box-shadow: 0 0 28px rgba(34, 211, 238, 0.35);
      }
      .skill-orb-item:hover > div {
        background-color: rgba(8, 145, 178, 0.35);
        border-color: rgba(103, 232, 249, 0.9);
      }

      /* Animated gradient border for featured cards */
      @keyframes borderFlow { to { --angle: 360deg; } }
      @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
      .border-flow {
        position: relative;
        isolation: isolate;
      }
      .border-flow::after {
        content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; z-index: -1;
        background: conic-gradient(from var(--angle), transparent 0deg, #22d3ee 60deg, #8b5cf6 120deg, transparent 180deg, transparent 360deg);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
        animation: borderFlow 6s linear infinite;
      }

      /* ===== PROJECT DETAIL MODAL ===== */
      @keyframes pmBackdrop { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pmPanel { from { opacity: 0; transform: perspective(1400px) translateY(40px) rotateX(8deg) scale(.94); } to { opacity: 1; transform: none; } }
      @keyframes pmIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
      @keyframes pmCover { from { transform: scale(1.18); } to { transform: scale(1); } }
      @keyframes pmGlow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      .pm-backdrop { animation: pmBackdrop .3s ease both; }
      .pm-panel { animation: pmPanel .6s cubic-bezier(.16,1,.3,1) both; transform-origin: 50% 100%; }
      .pm-in { animation: pmIn .6s cubic-bezier(.2,.9,.3,1) backwards; animation-delay: calc(250ms + var(--i, 0) * 70ms); }
      .pm-cover { animation: pmCover 1.6s cubic-bezier(.16,1,.3,1) both; }
      .pm-glow { animation: pmGlow 4s ease-in-out infinite; }
      .pm-close { transition: transform .4s cubic-bezier(.2,1.4,.3,1), background-color .3s; }
      .pm-close:hover { transform: rotate(90deg) scale(1.1); }
      .pm-pill { transition: transform .3s cubic-bezier(.2,1.4,.3,1), background-color .3s, border-color .3s; }
      .pm-pill:hover { transform: translateY(-3px); background-color: rgba(67,56,202,.35); border-color: rgba(129,140,248,.6); }
      .pm-feature { transition: transform .35s cubic-bezier(.2,1.2,.3,1), border-color .3s, box-shadow .3s, background-color .3s; }
      .pm-feature:hover { transform: translateY(-4px); background-color: rgba(8,145,178,.1); box-shadow: 0 14px 30px -14px rgba(34,211,238,.4); }
      .pm-btn { transition: transform .3s cubic-bezier(.2,1.4,.3,1), filter .3s, border-color .3s, background-color .3s; }
      .pm-btn:hover { transform: translateY(-2px); filter: brightness(1.12); }
      @media (prefers-reduced-motion: reduce) {
        .pm-backdrop, .pm-panel, .pm-in, .pm-cover, .pm-glow { animation: none; }
      }

      /* ===== EXPERIENCE TIMELINE ===== */
      .xp-timeline { --p: 0; }
      .xp-track { background: rgba(51,65,85,.55); border-radius: 9999px; }
      .xp-fill {
        position: absolute; left: 0; top: 0; width: 100%; height: calc(var(--p) * 100%);
        background: linear-gradient(to bottom, #22d3ee, #3b82f6, #8b5cf6);
        border-radius: 9999px; box-shadow: 0 0 14px rgba(34,211,238,.7);
      }
      .xp-fill::after {
        content: ''; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; transform: translateX(-50%);
        border-radius: 9999px; background: #fff; box-shadow: 0 0 14px 4px rgba(34,211,238,.9);
      }
      .xp-node-core { border: 2px solid rgba(71,85,105,.9); transition: border-color .5s, box-shadow .5s, transform .5s cubic-bezier(.2,1.4,.3,1); filter: grayscale(.8) brightness(.8); }
      .xp-node[data-lit="1"] .xp-node-core { border-color: rgb(var(--ac)); box-shadow: 0 0 22px rgba(var(--ac), .55); filter: none; transform: scale(1.08); }
      .xp-row:hover .xp-node-core { transform: scale(1.18); }
      .xp-ping { position: absolute; inset: 0; border-radius: 9999px; background: rgba(var(--ac), .5); animation: xpPing 2s cubic-bezier(0,0,.2,1) infinite; }
      @keyframes xpPing { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.1); opacity: 0; } }
      .xp-arm { background: linear-gradient(to right, rgba(var(--ac), .0), rgba(var(--ac), .6)); opacity: .5; transition: opacity .4s; }
      .xp-row:hover .xp-arm { opacity: 1; }
      .xp-card { transition: border-color .4s, box-shadow .4s, transform .5s cubic-bezier(.2,1,.3,1); }
      .xp-card:hover { border-color: rgba(var(--ac), .5); box-shadow: 0 24px 50px -22px rgba(var(--ac), .45); transform: translateY(-3px); }
      .xp-card::before { background: radial-gradient(380px circle at var(--mx) var(--my), rgba(var(--ac), .16), transparent 70%); }
      .xp-card::after { background: conic-gradient(from var(--angle), transparent 0deg, rgb(var(--ac)) 80deg, transparent 200deg, transparent 360deg); }
      .xp-bar { position: absolute !important; left: 0; top: 0; bottom: 0; width: 3px; z-index: 2 !important; background: linear-gradient(to bottom, rgb(var(--ac)), transparent); opacity: .7; transform-origin: top; transition: opacity .4s; }
      .xp-card:hover .xp-bar { opacity: 1; }
      .xp-badge { background: rgba(var(--ac), .12); border: 1px solid rgba(var(--ac), .35); color: rgb(var(--ac)); }
      .xp-chip { background: rgba(var(--ac), .08); border: 1px solid rgba(var(--ac), .25); color: rgb(var(--ac)); }
      .cert-card:hover .xp-chip { background: rgba(var(--ac), .18); border-color: rgba(var(--ac), .55); color: #fff; }
      .xp-bullet { width: 6px; height: 6px; border-radius: 2px; background: rgb(var(--ac)); transform: rotate(45deg); transition: transform .4s cubic-bezier(.2,1.4,.3,1), box-shadow .4s; }
      .xp-li:hover .xp-bullet { transform: rotate(225deg) scale(1.5); box-shadow: 0 0 10px rgb(var(--ac)); }
      .cert-in .xp-li, .cert-in .xp-card > div:first-of-type { animation: certRise .6s cubic-bezier(.2,.9,.3,1) backwards; animation-delay: calc(120ms + var(--i, 0) * 70ms); }
      .cert-pre .xp-li { opacity: 0; }
      @media (prefers-reduced-motion: reduce) {
        .xp-ping { animation: none; }
        .cert-pre .xp-li { opacity: 1; }
      }

      /* ===== CERTIFICATE CARDS ===== */
      .cert-card {
        position: relative; isolation: isolate; overflow: hidden;
        --mx: 50%; --my: 50%;
        transition: border-color .4s, box-shadow .4s;
      }
      /* spotlight following cursor */
      .cert-card::before {
        content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
        background: radial-gradient(380px circle at var(--mx) var(--my), rgba(34,211,238,.16), rgba(139,92,246,.08) 40%, transparent 70%);
        opacity: 0; transition: opacity .4s;
      }
      .cert-card:hover::before { opacity: 1; }
      /* rotating gradient border, visible on hover */
      .cert-card::after {
        content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; z-index: 2; pointer-events: none;
        background: conic-gradient(from var(--angle), transparent 0deg, #22d3ee 70deg, #8b5cf6 140deg, transparent 220deg, transparent 360deg);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude;
        opacity: 0; transition: opacity .5s;
        animation: borderFlow 4s linear infinite;
      }
      .cert-card:hover::after { opacity: 1; }
      .cert-card > * { position: relative; z-index: 1; }
      /* diagonal shine sweep */
      .cert-shine {
        position: absolute !important; inset: 0; z-index: 3 !important; pointer-events: none;
        background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.14) 50%, transparent 65%);
        transform: translateX(-120%);
      }
      .cert-card:hover .cert-shine { transform: translateX(120%); transition: transform .9s cubic-bezier(.2,.7,.2,1); }
      /* big index number watermark */
      .cert-index {
        position: absolute !important; right: 14px; top: 2px; z-index: 0 !important;
        font: 800 4.5rem/1 ui-monospace, monospace; color: transparent;
        -webkit-text-stroke: 1px rgba(148,163,184,.14);
        transition: -webkit-text-stroke-color .4s, transform .6s cubic-bezier(.2,.8,.2,1);
        pointer-events: none; user-select: none;
      }
      .cert-card:hover .cert-index { -webkit-text-stroke-color: rgba(34,211,238,.45); transform: translateY(6px) scale(1.08); }
      /* medal icon with orbiting ring */
      .cert-medal { position: relative; }
      .cert-medal::before {
        content: ''; position: absolute; inset: -5px; border-radius: 16px; z-index: -1;
        background: conic-gradient(from var(--angle), transparent, rgba(168,85,247,.9), transparent 55%);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor; mask-composite: exclude; padding: 1.5px;
        animation: borderFlow 3s linear infinite; opacity: .55;
      }
      .cert-card:hover .cert-medal { animation: medalPop .7s cubic-bezier(.2,1.4,.3,1); box-shadow: 0 0 28px rgba(168,85,247,.55); }
      .cert-card:hover .cert-medal svg { animation: medalWiggle .8s ease; }
      @keyframes medalPop { 0% { transform: scale(1) rotate(0); } 50% { transform: scale(1.25) rotate(-12deg); } 100% { transform: scale(1.1) rotate(0); } }
      @keyframes medalWiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(14deg); } 60% { transform: rotate(-10deg); } }
      /* skill chips pop in one after another */
      .cert-chip { transition: transform .35s cubic-bezier(.2,1.4,.3,1), background-color .3s, border-color .3s, color .3s; transition-delay: calc(var(--i) * 45ms); }
      .cert-card:hover .cert-chip { transform: translateY(-3px); border-color: rgba(34,211,238,.45); color: #a5f3fc; background-color: rgba(8,145,178,.2); }
      /* view button */
      .cert-btn { position: relative; overflow: hidden; }
      .cert-btn::before {
        content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,182,212,.0), rgba(6,182,212,.25), rgba(139,92,246,.25));
        transform: translateX(-101%); transition: transform .5s cubic-bezier(.2,.8,.2,1);
      }
      .cert-btn:hover::before { transform: translateX(0); }
      .cert-btn > * { position: relative; }
      .cert-btn svg { transition: transform .4s cubic-bezier(.2,1.4,.3,1); }
      .cert-btn:hover svg { transform: scale(1.3) rotate(-8deg); }
      /* entrance for inner content when card is scrolled in */
      @keyframes certRise { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
      .cert-in .cert-medal, .cert-in .cert-text > *, .cert-in .cert-chip, .cert-in .cert-btn {
        animation: certRise .6s cubic-bezier(.2,.9,.3,1) backwards; animation-delay: calc(120ms + var(--i, 0) * 70ms);
      }
      .cert-pre .cert-medal, .cert-pre .cert-text > *, .cert-pre .cert-chip, .cert-pre .cert-btn { opacity: 0; }

      /* media (project cover / paper preview) */
      .cert-media { overflow: hidden; }
      .cert-media img { transition: transform .8s cubic-bezier(.2,.8,.2,1), filter .6s; }
      .cert-card:hover .cert-media img { transform: scale(1.1) rotate(.6deg); filter: saturate(1.15) brightness(1.05); }
      @keyframes mediaReveal { from { clip-path: inset(0 100% 0 0); transform: scale(1.15); } to { clip-path: inset(0 0 0 0); transform: none; } }
      .cert-in .cert-media { animation: mediaReveal .9s cubic-bezier(.7,0,.2,1) backwards; }
      .cert-pre .cert-media { opacity: 0; }
      /* pulsing status dot */
      @keyframes dotPing { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.6); } 100% { box-shadow: 0 0 0 8px rgba(52,211,153,0); } }
      .status-dot { width: 6px; height: 6px; border-radius: 9999px; background: #34d399; animation: dotPing 1.8s infinite; display: inline-block; }
      /* publication paper preview floats on hover */
      .cert-card:hover .pub-preview { transform: translateY(-4px) rotate(-1deg); box-shadow: 0 18px 40px -12px rgba(34,211,238,.35); }
      .pub-preview { transition: transform .5s cubic-bezier(.2,1.2,.3,1), box-shadow .5s; }
      /* tag slides in project cover */
      .cert-card .cert-tag { transition: transform .4s cubic-bezier(.2,1.4,.3,1); }
      .cert-card:hover .cert-tag { transform: translateY(2px) scale(1.06); }
      .cert-in .cert-text > *, .cert-in .cert-tag { animation-fill-mode: backwards; }
      .cert-pre .cert-tag { opacity: 0; }
      .cert-in .cert-tag { animation: certRise .6s cubic-bezier(.2,.9,.3,1) backwards; animation-delay: 300ms; }

      @media (prefers-reduced-motion: reduce) {
        .cert-pre .cert-media, .cert-pre .cert-tag { opacity: 1; }
        .status-dot { animation: none; }
        .cert-card::after, .cert-medal::before { animation: none; }
        .cert-in *, .cert-card:hover * { animation: none !important; }
        .cert-pre .cert-medal, .cert-pre .cert-text > *, .cert-pre .cert-chip, .cert-pre .cert-btn { opacity: 1; }
        .orbit-spin, .orbit-spin-reverse, .border-flow::after, .animate-float-slow, .animate-pulse-glow { animation: none; }
        .tilt-card-inner { transition: none; }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen (plain HTML so it shows before the app bundle loads) -->
    <div id="preloader" role="status" aria-live="polite" aria-label="Memuat portofolio">
      <div class="pl-door pl-door-top"></div>
      <div class="pl-door pl-door-bottom"></div>
      <div class="pl-seam"></div>
      <div class="pl-content">
        <div class="pl-reactor">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <linearGradient id="plGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#3b82f6" />
                <stop offset="100%" stop-color="#22d3ee" />
              </linearGradient>
            </defs>
            <circle class="pl-track" cx="100" cy="100" r="88" />
            <circle class="pl-progress" id="pl-ring" cx="100" cy="100" r="88" />
            <g class="pl-spin"><circle class="pl-ring-a" cx="100" cy="100" r="72" /></g>
            <g class="pl-spin-rev"><circle class="pl-ring-b" cx="100" cy="100" r="60" /></g>
          </svg>
          <div class="pl-core"></div>
          <div class="pl-percent"><span><span id="pl-num">0</span><small>%</small></span></div>
        </div>
        <div class="pl-name">FADIL <span>RAFLIANSYAH</span></div>
        <div class="pl-bar"><i id="pl-bar"></i></div>
        <div class="pl-status" id="pl-status">Initializing systems</div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('preloader');
        if (!el) return;
        var root = document.documentElement;
        var num = document.getElementById('pl-num');
        var ring = document.getElementById('pl-ring');
        var bar = document.getElementById('pl-bar');
        var status = document.getElementById('pl-status');
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        var CIRC = 552.92;
        var MIN = reduce ? 300 : 1900;   // let the animation be seen
        var MAX = 9000;                  // never hold the site hostage
        var start = performance.now();
        var total = 0, done = 0;
        var steps = [
          [0, 'Initializing systems'],
          [0.25, 'Loading assets'],
          [0.55, 'Calibrating reactor'],
          [0.85, 'Suiting up'],
          [1, 'System ready']
        ];
        root.classList.add('is-loading');

        function track(promise) {
          total++;
          var settle = function () { done++; };
          promise.then(settle, settle);
        }
        // the heavy images the first screens need (same CORS mode as the app, so the cache is reused)
        ['/fadil-photo.png', '/fadil-hero.webp', '/ironman-hero.webp'].forEach(function (src) {
          track(new Promise(function (resolve) {
            var img = new Image();
            if (src.indexOf('.webp') > 0) img.crossOrigin = 'anonymous';
            img.onload = img.onerror = resolve;
            img.src = src;
          }));
        });
        if (document.fonts && document.fonts.ready) track(document.fonts.ready);
        track(new Promise(function (resolve) {
          if (document.readyState === 'complete') resolve();
          else window.addEventListener('load', resolve, { once: true });
        }));

        var shown = 0, label = '';
        function frame(now) {
          var t = now - start;
          var target = Math.min(done / total, t / MIN);
          if (t > MAX) target = 1;
          shown += (target - shown) * 0.09;
          if (target - shown < 0.003) shown = target;
          var pct = Math.round(shown * 100);
          num.textContent = pct;
          ring.style.strokeDashoffset = CIRC * (1 - shown);
          bar.style.transform = 'scaleX(' + shown + ')';
          for (var i = steps.length - 1; i >= 0; i--) {
            if (shown >= steps[i][0]) {
              if (label !== steps[i][1]) { label = steps[i][1]; status.textContent = label; }
              break;
            }
          }
          if (shown >= 1) setTimeout(leave, reduce ? 0 : 280);
          else requestAnimationFrame(frame);
        }

        var left = false;
        function leave() {
          if (left) return;
          left = true;
          el.classList.add('pl-exit');
          setTimeout(function () {
            el.classList.add('pl-open');
            root.classList.remove('is-loading');
            window.dispatchEvent(new Event('portfolio:ready'));
          }, reduce ? 0 : 450);
          setTimeout(function () { el.remove(); }, reduce ? 50 : 1450);
        }

        requestAnimationFrame(frame);
        // backup: even if something above throws, unlock the page
        setTimeout(leave, MAX + 1500);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
